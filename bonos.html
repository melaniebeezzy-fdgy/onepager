<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foodology | Bonos</title>
<link rel="icon" href="data:,">
<style>
:root{--navy:#12263f;--ink:#1b2a3d;--indigo:#5457d6;--indigo2:#ecedfb;--muted:#6b7a90;--line:#e6ebf2;--bg:#f4f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
/* ===== PICKER ===== */
#picker{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#picker .logo{font-weight:900;color:var(--navy);font-size:15px;letter-spacing:.5px;margin-bottom:18px}
#picker h1{font-size:30px;color:var(--navy);margin:0 0 4px;font-weight:800}
#picker p{color:var(--muted);margin:0 0 26px;font-size:14px}
#picker .cs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#picker .cs button{font-size:17px;font-weight:800;padding:20px 34px;border-radius:14px;border:1.5px solid var(--indigo);background:#fff;color:var(--indigo);cursor:pointer;transition:.15s}
#picker .cs button:hover{background:var(--indigo);color:#fff;transform:translateY(-2px)}
/* ===== APP ===== */
#app{display:none;flex-direction:column;height:100%}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;min-height:38px}
.topbar .logo{font-weight:900;font-size:13px}
.topbar .ttl{font-weight:600;font-size:12.5px;opacity:.9}
.topbar .ttl b{color:#8ea2ff}
.topbar .sp{flex:1}
.pills{display:flex;gap:6px}
.pills button{border:1px solid #ffffff33;background:transparent;color:#cfe0f2;font-weight:700;padding:3px 10px;border-radius:8px;cursor:pointer;font-size:11.5px}
.pills button.active{background:var(--indigo);border-color:var(--indigo);color:#fff}
.tabbar{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tabbar button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:7px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabbar button:hover{color:var(--navy)}
.tabbar button.active{color:var(--indigo);border-bottom-color:var(--indigo)}
.stage{flex:1;min-height:0;position:relative}
iframe{border:none;width:100%;height:100%;display:block;background:var(--bg)}
.ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px}
.ph .ic{font-size:46px;margin-bottom:10px}
.ph h2{color:var(--navy);margin:0 0 6px;font-size:20px}
.ph p{margin:0;font-size:13px;max-width:460px;line-height:1.5}
</style>
</head>
<body>
<div id="picker">
  <div class="logo">fdgy.</div>
  <h1>💰 Bonos Foodology</h1>
  <p>Elige un país para ver sus bonos</p>
  <div class="cs">
    <button onclick="setCountry('COL')">🇨🇴 Colombia</button>
    <button onclick="setCountry('MEX')">🇲🇽 México</button>
    <button onclick="setCountry('PER')">🇵🇪 Perú</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <span class="logo">fdgy.</span>
    <span class="ttl">Bonos Foodology · <b id="cname"></b><span id="tname"></span><span id="tsub" style="opacity:.7;font-weight:500"></span></span>
    <span class="sp"></span>
    <div class="pills" id="pills"></div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
var NAME={COL:'🇨🇴 Colombia',MEX:'🇲🇽 México',PER:'🇵🇪 Perú'};
var TABS=[
 {id:'wow',ic:'🗓️',label:'Mensual WOW Cocinas',src:'/bonos-wow'},
 {id:'jef',ic:'👥',label:'Trimestral Jefes/Segundos',src:'/bonos-jefes'},
 {id:'ops',ic:'🧭',label:'Trimestral Ops Manager',src:'/bonos-ops'},
 {id:'cp', ic:'🏭',label:'Trimestral Gerentes de CP',ph:'El esquema de este bono está por definir. Cuando tengas su estructura lo conectamos aquí.'}
];
var country=null, tab='wow';
function setCountry(c){country=c;if(!tabsFor(c).some(function(t){return t.id===tab;}))tab='wow';renderApp();}
function pick(id){tab=id;syncHash();renderStage();renderTabs();}
function updTitle(){var t=tabsFor(country).filter(function(x){return x.id===tab;})[0];document.getElementById('tname').textContent=t?' · '+t.label:'';document.getElementById('tsub').textContent='';}
window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||typeof e.data.bonoSub!=='string')return;document.getElementById('tsub').textContent=e.data.bonoSub?' · '+e.data.bonoSub:'';});
function syncHash(){location.hash=country+'/'+tab;}
function renderApp(){
  document.getElementById('picker').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('cname').textContent=NAME[country];
  document.getElementById('pills').innerHTML=['COL','MEX','PER'].map(function(c){
    return '<button class="'+(c===country?'active':'')+'" onclick="setCountry(\''+c+'\')">'+NAME[c]+'</button>';}).join('');
  renderTabs();renderStage();syncHash();
}
// Perú no tiene bono de Ops Manager ni de Gerentes de CP
function tabsFor(c){return TABS.filter(function(t){return !(c==='PER'&&(t.id==='ops'||t.id==='cp'));});}
function renderTabs(){updTitle();
  document.getElementById('tabbar').innerHTML=tabsFor(country).map(function(t){
    return '<button class="'+(t.id===tab?'active':'')+'" onclick="pick(\''+t.id+'\')"><span>'+t.ic+'</span>'+t.label+'</button>';}).join('');
}
function renderStage(){
  var t=TABS.filter(function(x){return x.id===tab;})[0];
  var st=document.getElementById('stage');
  if(t.src){st.innerHTML='<iframe src="'+t.src+'?c='+country+'" title="'+t.label+'"></iframe>';}
  else{st.innerHTML='<div class="ph"><div class="ic">🛠️</div><h2>'+t.label+' · '+NAME[country]+'</h2><p>'+t.ph+'</p></div>';}
}
// deep-link: #COL/jef
(function(){var h=(location.hash||'').slice(1).split('/');if(h[0]&&NAME[h[0]]){country=h[0];if(h[1]&&tabsFor(h[0]).some(function(t){return t.id===h[1];}))tab=h[1];renderApp();}})();
</script>
</body>
</html>
