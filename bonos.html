<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foodology | Bonos</title>
<link rel="icon" href="data:,">
<style>
:root{--navy:#0E2841;--navy2:#244768;--line:#e6ebf2;--muted:#6b7a90;--bg:#f4f6fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:#1b2a3d;display:flex;flex-direction:column;height:100vh}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:52px;flex-wrap:wrap}
.topbar .brand{font-weight:800;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;color:#cfe0f2;font-weight:600;padding:9px 14px;border-radius:9px 9px 0 0;cursor:pointer;font-size:13px;white-space:nowrap}
.tabs button:hover{background:#ffffff1a;color:#fff}
.tabs button.active{background:var(--bg);color:var(--navy);font-weight:800}
.stage{flex:1;position:relative;min-height:0}
iframe{border:none;width:100%;height:100%;display:block;background:var(--bg)}
.ph{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--muted);padding:30px}
.ph .ic{font-size:46px;margin-bottom:10px}
.ph h2{color:var(--navy);margin:0 0 6px;font-size:20px}
.ph p{margin:0;font-size:13px;max-width:460px;line-height:1.5}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">💰 Bonos · Foodology</div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="stage" id="stage"></div>
<script>
var TABS=[
 {id:'wow',label:'Mensual WOW Cocinas',src:'/bonos-wow'},
 {id:'jef',label:'Trimestral Jefes/Segundos',src:'/bonos-jefes'},
 {id:'ops',label:'Trimestral Ops Manager',ph:'El esquema de este bono está por definir. Cuando tengas su estructura (indicadores, metas y montos) lo conectamos aquí.'},
 {id:'cp', label:'Trimestral Gerentes de CP',ph:'El esquema de este bono está por definir. Cuando tengas su estructura lo conectamos aquí.'}
];
var cur=null;
function render(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){
    return '<button class="'+(t.id===cur?'active':'')+'" onclick="pick(\''+t.id+'\')">'+t.label+'</button>';}).join('');
  var t=TABS.filter(function(x){return x.id===cur;})[0];
  var st=document.getElementById('stage');
  if(t.src){st.innerHTML='<iframe src="'+t.src+'" title="'+t.label+'"></iframe>';}
  else{st.innerHTML='<div class="ph"><div class="ic">🛠️</div><h2>'+t.label+'</h2><p>'+t.ph+'</p></div>';}
}
function pick(id){cur=id;location.hash=id;render();}
cur=(location.hash||'#wow').slice(1);
if(!TABS.some(function(t){return t.id===cur;}))cur='wow';
render();
</script>
</body>
</html>
