<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodology | One Pager 360°</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%230d2064%27/%3E%3Ctext%20x%3D%2730%27%20y%3D%2730%27%20font-family%3D%27Verdana%2CGeneva%2Csans-serif%27%20font-size%3D%2719%27%20font-weight%3D%27700%27%20fill%3D%27%23ffffff%27%20text-anchor%3D%27middle%27%3Efdgy%3C/text%3E%3Ccircle%20cx%3D%2754%27%20cy%3D%2730%27%20r%3D%272.4%27%20fill%3D%27%23ef8fb4%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2750%27%20font-family%3D%27Verdana%2CGeneva%2Csans-serif%27%20font-size%3D%2714%27%20font-weight%3D%27700%27%20fill%3D%27%23ef8fb4%27%20text-anchor%3D%27middle%27%3E360%C2%B0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#090e3e;--navy:#0E2841;--navy2:#242F42;--steel:#153D64;--teal-d:#156082;
  --teal:#0B769F;--cyan:#0F9ED5;--slate:#345964;--sea:#467886;--mauve:#96607D;
  --pink:#C19EB1;--sand:#e8d2ae;--paper:#E8E8E8;--green:#2f9e5f;--amber:#e2a52a;
  --red:#d64545;--ink:#242F42;--muted:#6b7686;--line:#e7ebf1;--bg:#f4f6fa;--card:#fff;
  --shadow:0 1px 3px rgba(9,14,62,.06),0 8px 24px rgba(9,14,62,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:12.5px;line-height:1.4}
html{scroll-behavior:smooth}
h1,h2,h3,h4{font-weight:600;color:var(--primary)}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(120deg,rgba(9,14,62,.72),rgba(21,61,100,.55)),
  url('https://images.squarespace-cdn.com/content/v1/5e711db98f62f46196625761/1651616585662-7L3JLXHY0UMDJBU9KFFB/Banner-03-02.png?format=2500w') center/cover no-repeat;}
.login-card{background:rgba(255,255,255,.97);border-radius:20px;padding:44px 40px;width:360px;box-shadow:0 30px 70px rgba(9,14,62,.35);text-align:center}
.login-card .brandbar{background:var(--primary);border-radius:12px;padding:16px;margin-bottom:22px}
.login-card .brandbar img{height:34px}
.login-card h2{color:var(--primary);font-size:19px;margin-bottom:2px}
.login-card p{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.login-card label{display:block;text-align:left;font-size:11.5px;font-weight:600;color:var(--slate);margin:12px 0 5px}
.login-card input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px}
.login-card input:focus{outline:none;border-color:var(--cyan)}
.login-card button{width:100%;margin-top:22px;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;font-size:14px}
.login-card button:hover{background:#141a5c}

/* TOP BAR */
#top{position:fixed;top:0;left:0;right:0;height:58px;background:var(--primary);z-index:40;display:flex;align-items:center;padding:0 20px;gap:14px;box-shadow:0 2px 10px rgba(9,14,62,.25)}
#top .burger{background:rgba(255,255,255,.12);border:none;color:#fff;width:38px;height:38px;border-radius:9px;font-size:16px;display:flex;align-items:center;justify-content:center}
#top .burger:hover{background:rgba(255,255,255,.22)}
#top .ttl{color:#fff;font-weight:600;font-size:15px}
#top .ttl span{color:var(--pink);font-weight:400;font-size:12px;margin-left:6px}
#top .spacer{flex:1}
.scopesel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;font-family:inherit;font-size:12.5px;font-weight:500;padding:8px 12px;border-radius:9px;max-width:230px;cursor:pointer}
.scopesel:focus{outline:none;border-color:var(--cyan)}
.scopesel option{color:#111}
.viewtoggle{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.viewtoggle button{background:transparent;border:none;color:#c7cbe8;font-size:12px;font-weight:500;padding:7px 13px;border-radius:8px}
.viewtoggle button.active{background:#fff;color:var(--primary);font-weight:600}
#top .logo{height:30px;margin-left:6px;display:block}
.logo-text{color:#fff;font-weight:700;font-size:20px;letter-spacing:.3px;margin-left:6px;font-family:'Poppins',sans-serif}
.login-card .logo-text{color:#fff;font-size:26px}

/* SIDEBAR */
#side{position:fixed;top:58px;left:0;bottom:0;width:60px;background:#0b1030;z-index:30;padding:12px 0;overflow-y:auto;overflow-x:hidden;transition:width .18s;box-shadow:2px 0 12px rgba(9,14,62,.15)}
#side .search{padding:0 12px 8px}
#side .search input{width:100%;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:9px;padding:9px 12px;font-family:inherit;font-size:12px}
#side .search input::placeholder{color:#7b83b0}
#side .search input:focus{outline:none;border-color:var(--cyan);background:rgba(255,255,255,.14)}
#side .grp{color:#5b6494;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:12px 18px 5px;white-space:nowrap}
#side a{display:flex;align-items:center;gap:12px;color:#c3c8e6;text-decoration:none;font-size:12.5px;padding:9px 18px;border-left:3px solid transparent;cursor:pointer}
#side a .ic{width:22px;text-align:center;font-size:15px;flex:0 0 22px}
#side a .lbl{white-space:nowrap;overflow:hidden}
#side a:hover{background:rgba(255,255,255,.05);color:#fff}
#side a.active{background:linear-gradient(90deg,rgba(15,158,213,.22),transparent);color:#fff;border-left-color:var(--cyan);font-weight:600}
#side a.dim{display:none}
body.collapsed #side .grp,body.collapsed #side .search{opacity:0;height:0;padding:0;overflow:hidden;pointer-events:none}
body.collapsed #side a .lbl{display:none}
/* MAIN */
#main{margin-left:0;margin-top:58px;padding:14px 26px 40px}
section[id^="sec-"]{scroll-margin-top:66px;margin-bottom:14px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:15px;font-weight:700}
.page-head .sub{color:var(--muted);font-size:10px;margin-top:1px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 11px;font-size:11.5px;color:var(--slate);font-weight:500}
.chip b{color:var(--primary)}

.grid{display:grid;gap:9px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
.mt{margin-top:9px}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card.kpi{display:flex;flex-direction:column;justify-content:center}
.kpi .lbl{font-size:9.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.kpi .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.kpi .big{font-size:22px;font-weight:700;margin:5px 0 1px;line-height:1}
.kpi .meta{font-size:10.5px;color:var(--muted)}
.kpi .foot{margin-top:7px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}
.bar{height:6px;border-radius:6px;background:var(--paper);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.hero{border-radius:12px;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.hero .hl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
.hero .big{font-size:44px;font-weight:800;line-height:1;margin:4px 0}
.hero .meta{opacity:.9;font-size:12px}
.hero .track{height:9px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:12px;overflow:hidden;position:relative}
.hero .track>i{display:block;height:100%;background:#fff;border-radius:6px}
.hero .badge{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;align-self:flex-start}
/* variante compacta (a la altura de las tarjetas KPI chicas) */
.hero.sm{padding:11px 13px;position:relative}
.hero.sm .hl{font-size:9.5px;letter-spacing:.3px;padding-right:72px}
.hero.sm .big{font-size:24px;margin:4px 0 1px}
.hero.sm .meta{font-size:10.5px}
.hero.sm .track{height:6px;margin-top:8px}
.hero.sm .badge{position:absolute;top:10px;right:12px;margin-top:0;padding:3px 9px;font-size:10.5px}
.hero.sm>div[style*="margin-top:6px"]{font-size:11px!important}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600}
.pill.g{background:#e7eef6;color:#0e2841}.pill.a{background:#f6ecd3;color:#a5761c}.pill.r{background:#fbe8f0;color:#cf6a95}.pill.p{background:#e7aec6;color:#6b1338}
.up{color:var(--green)}.down{color:var(--red)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.g{background:#0e2841}.dot.a{background:#d8b25f}.dot.r{background:#df99b9}.dot.n{background:#cdd3dd}
.card h3{font-size:12.5px;margin-bottom:1px}
.card .csub{font-size:10.5px;color:var(--muted);margin-bottom:10px}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title h3{margin:0}
.tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.5px}
.tag.r{background:#fbe4e4;color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;border-bottom:1px solid var(--line)}
td{padding:6.5px 8px;border-bottom:1px solid #f1f4f8}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
.mini-bar{height:6px;border-radius:4px;background:var(--paper);width:64px;display:inline-block;vertical-align:middle;overflow:hidden}
.mini-bar>i{display:block;height:100%}

.hbar{display:flex;align-items:center;gap:9px;margin:6px 0}
.hbar .nm{width:130px;font-size:11px;color:var(--slate);font-weight:500}
.hbar .track{flex:1;height:9px;background:var(--paper);border-radius:6px;overflow:hidden}
.hbar .track>i{display:block;height:100%;border-radius:6px}
.hbar .vl{width:96px;text-align:right;font-size:11px;font-weight:600}

.ai{background:linear-gradient(120deg,#f3f0f7,#eef3f8);border:1px solid #e5e0ee;border-radius:12px;padding:13px 15px}
.ai .h{font-size:10px;font-weight:700;color:var(--mauve);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ai-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
@media(max-width:900px){.ai-cols{grid-template-columns:1fr}}
.ai h5{font-size:11.5px;color:var(--slate);margin-bottom:5px}
.ai p,.ai li{font-size:11.5px;color:#4a5568;line-height:1.5}
.ai ul{list-style:none}
.ai li{padding-left:16px;position:relative;margin-bottom:4px}
.ai li:before{content:'✓';position:absolute;left:0;color:var(--teal);font-weight:700}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.paistoggle{display:flex;gap:8px;margin:12px 0 6px}
.paistoggle button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;display:flex;align-items:center;gap:7px}
.paistoggle button:hover{border-color:var(--cyan)}
.paistoggle button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.country-tabs{display:flex;gap:8px;margin-bottom:12px}
.country-tabs button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--slate)}
.country-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.country-tabs button b{opacity:.7;margin-left:6px;font-weight:500}
.placeholder{text-align:center;padding:44px 20px;color:var(--muted)}
.placeholder .pic{font-size:34px;margin-bottom:10px}
.placeholder h2{color:var(--slate);font-size:16px}
.heat{width:100%;border-collapse:collapse;font-size:11px}
.heat td,.heat th{text-align:center;padding:8px 5px}
.heat th:first-child,.heat td:first-child{text-align:left;font-weight:500;color:var(--slate)}
.heat .cell{width:15px;height:15px;border-radius:50%;display:inline-block}
.stack{display:flex;height:20px;border-radius:5px;overflow:hidden}
.stack>i{display:block;height:100%}
.badge-pend{background:#fbe8f0;color:#cf6a95;font-weight:600;font-size:11px;padding:3px 11px;border-radius:20px}
.qitem{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #f1f4f8}
.qitem:last-child{border-bottom:none}
.qic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 36px}
.qtx{flex:1;min-width:0}
.qt{font-weight:600;color:var(--primary);font-size:12.5px}
.qd{color:var(--muted);font-size:11px;margin-top:1px}
.qch{color:var(--muted);font-size:17px;border:1px solid var(--line);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.note{background:#eef3f8;border:1px dashed #cdd8e6;border-radius:9px;padding:9px 13px;font-size:11px;color:var(--slate);margin-top:11px}
</style>
</head>

/* ================= HELPERS ================= */
function f1(n){return (Math.round(n*10)/10).toString().replace('.',',');}
function f2(n){return n.toFixed(2).replace('.',',');}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function sum(a){return a.reduce((x,y)=>x+y,0);}
/* colores de ESTADO/cumplimiento (verde/amarillo/rojo reservados solo para variación) */
var C_OK='#0e2841';   /* cumple → azul principal */
var C_MID='#a5761c';  /* intermedio → tono card (beige) */
var C_LOW='#cf6a95';  /* no cumple → rosado #df99b9 (tono legible) */
function stCol(b){return b==='g'?C_OK:b==='a'?C_MID:b==='p'?'#6b1338':C_LOW;}
/* variación: mejora=verde, estático=amarillo, desmejora=rojo.
   lowerBetter=true en métricas donde bajar es mejorar (GAP, RTWT, cancelaciones, rotación...) */
function delta(v,unit,lowerBetter){unit=(unit===undefined)?' pp':unit;var av=Math.abs(v);var a=(av%1===0)?av.toLocaleString('es'):av.toFixed(2).replace('.',',');
  var arrow=v>0?'▲':(v<0?'▼':'■');
  var improved=lowerBetter?(v<0):(v>0);
  var col=v===0?'var(--amber)':(improved?'var(--green)':'var(--red)');
  return '<span style="color:'+col+';font-weight:600;white-space:nowrap">'+arrow+' '+a+unit.replace(/ /g,' ')+'</span>';}
/* variación pseudo-determinística estable por clave (para el mockup) */
function seedNum(s){var h=5381;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h;}
function vary(key,max){var r=((seedNum(key)%1000)/1000)*2-1;var v=+(r*max).toFixed(2);if(Math.abs(v)<max*0.07)v=0;return v;}
function vdelta(key,max,unit,lowerBetter){return delta(vary(key,max),unit,lowerBetter);}
function estado(v){return v>=97.5?'g':v>=95?'a':'r';}
function estadoTxt(v){return v>=97.5?'Cumple':v>=95?'Alerta':'Crítico';}
function goCumpl(k){return Math.round((k.rto+k.lib+k.aseo+k.reu)/4);}
function curK(){for(var i=0;i<KIT.length;i++)if(KIT[i].n===selKitchen)return KIT[i];return KIT[0];}
function opsKit(o){return KIT.filter(function(k){return k.ops===o;});}
function rankIF(){return KIT.slice().sort(function(a,b){return b.iff-a.iff;});}
function head(t,s,c){return '<div class="page-head"><div><h1>'+t+'</h1><div class="sub">'+s+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(c||'')+'</div></div>';}
function kpiCard(color,ic,lbl,big,meta,barPct,barColor,foot,spk){return '<div class="card kpi"><div class="lbl"><span class="ic" style="background:'+color+'">'+ic+'</span>'+lbl+'</div>'+
  '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><div class="big" style="color:'+color+';margin:5px 0 1px">'+big+'</div>'+(foot?'<span style="font-size:11px;font-weight:600">'+foot+'</span>':'')+'</div>'+
  '<div class="meta">'+meta+'</div>'+(barPct!=null?'<div class="bar"><i style="width:'+Math.min(barPct,100)+'%;background:'+barColor+'"></i></div>':'')+(spk||'')+'</div>';}
function spark(vals,color){var w=140,h=32,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1;
  var pts=vals.map(function(v,i){var x=(i/(vals.length-1))*w;var y=h-((v-mn)/rng)*(h-6)-3;return x.toFixed(1)+','+y.toFixed(1);});
  var last=pts[pts.length-1].split(',');
  var area='0,'+h+' '+pts.join(' ')+' '+w+','+h;
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:34px;margin-top:10px;display:block"><polygon points="'+area+'" fill="'+color+'" opacity="0.10"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+color+'"/></svg>';}
function miniStat(lbl,val,sub){return '<div style="background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:11px 12px"><div style="font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600">'+lbl+'</div><div style="font-weight:600;color:var(--primary);margin:3px 0">'+val+'</div><div style="font-size:10.5px;color:var(--muted)">'+sub+'</div></div>';}
function hbar(nm,p,col,val){return '<div class="hbar"><div class="nm">'+nm+'</div><div class="track"><i style="width:'+Math.min(p,100)+'%;background:'+col+'"></i></div><div class="vl">'+val+'</div></div>';}
function colGO(v){return v>=90?C_OK:v>=70?C_MID:C_LOW;}
function colGap(v){return v<=3?C_OK:C_LOW;}
function colAcc(v){return v>=98?C_OK:C_MID;}
function colRot(v){return v<=3?C_OK:C_LOW;}
function colTurbo(v){return v<=12?C_OK:C_MID;}

function heroCard(label,valStr,metaStr,st,badge,barPct,deltaHtml,compact){
  var acc=st==='g'?C_OK:st==='a'?C_MID:C_LOW;
  var bg=st==='g'?'#e7eef6':st==='a'?'#f6ecd3':'#fbe8f0';
  return '<div class="hero'+(compact?' sm':'')+'" style="background:'+bg+';border:1px solid '+acc+'33;color:'+acc+'">'+
    '<div class="hl" style="color:'+acc+';opacity:.75">'+label+'</div>'+
    '<div class="big" style="color:'+acc+'">'+valStr+'</div>'+
    '<div class="meta" style="color:'+acc+';opacity:.75">'+metaStr+'</div>'+
    (deltaHtml?'<div style="margin-top:6px;font-size:12px">'+deltaHtml+' <span style="color:'+acc+';opacity:.7">vs sem. anterior</span></div>':'')+
    (compact?'':'<div class="track" style="background:'+acc+'22"><i style="width:'+Math.min(barPct,100)+'%;background:'+acc+'"></i></div>')+
    '<div class="badge" style="background:'+acc+'1f;color:'+acc+'">'+badge+'</div></div>';
}
function stGO(v){return v>=95?'g':v>=75?'a':'r';}
function heroRow(hero,restCards,cols){return '<div class="grid mt" style="grid-template-columns:280px 1fr;gap:9px">'+hero+'<div class="grid g'+(cols||3)+'">'+restCards+'</div></div>';}

/* ================= RESUMEN EJECUTIVO ================= */
function extraTbl(items){
  var ths=items.map(function(it){return '<th style="padding:2px 3px;border:none;text-transform:none;letter-spacing:0;font-size:8.5px;color:var(--muted);font-weight:600;text-align:center">'+it[0]+'</th>';}).join('');
  var tds=items.map(function(it){return '<td style="padding:2px 3px;border:none;font-weight:700;color:var(--ink);white-space:nowrap;text-align:center">'+it[1]+'</td>';}).join('');
  return '<table style="width:100%;border-collapse:collapse;font-size:9px"><tr>'+ths+'</tr><tr>'+tds+'</tr></table>';
}
var SC={g:'#2f9e5f',a:'#e2a52a',r:'#d64545',n:'#c3ccd8'};
function healthOf(k){return Math.round(0.30*goCumpl(k)+0.25*k.bas+0.20*k.cap+0.15*Math.max(0,Math.min(100,(k.iff-90)*8))+0.10*(k.gap<=3?92:55));}
function sttH(h){return h>=85?'g':h>=70?'a':'r';}
function opsResumen(){
  var ks=opsKit(selOps);
  var rows=ks.map(function(k){return {k:k,h:healthOf(k)};}).sort(function(a,b){return a.h-b.h;});
  var prom=Math.round(avg(rows.map(x=>x.h)));
  var crit=rows.filter(x=>x.h<70).length,riesgo=rows.filter(x=>x.h>=70&&x.h<85).length,cumplen=rows.filter(x=>x.h>=85).length,mejor=Math.max(1,Math.round(ks.length*0.35));
  /* ---- KPI strip ---- */
  function ok(color,ic,lbl,val,sub,dl,sv,bg){return '<div class="card" style="background:'+(bg||'#fff')+'"><div style="font-size:10px;font-weight:700;color:'+color+';text-transform:uppercase;letter-spacing:.4px">'+ic+' '+lbl+'</div><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px"><div><div style="font-size:26px;font-weight:800;color:'+color+';margin:4px 0 1px;line-height:1">'+val+'</div><div style="font-size:10.5px;color:var(--muted)">'+sub+'</div></div>'+(sv?'<div style="width:66px;flex:0 0 66px">'+spark(sv,color)+'</div>':'')+'</div>'+(dl?'<div style="font-size:11px;margin-top:6px">'+dl+'</div>':'')+'</div>';}
  var strip='<div class="grid g5" style="grid-template-columns:repeat(6,1fr)">'+
    ok('var(--primary)','🏢','Portafolio',ks.length,'Cocinas activas','','')+
    ok(SC.g,'💚','Salud general',prom+'%','Cumplimiento promedio',delta(4,' pp',false)+' <span style="color:var(--muted)">vs sem. anterior</span>',[70,73,71,75,76,prom],'#eef7f0')+
    ok(SC.r,'⚠️','Críticas',crit,'Cocinas críticas',delta(-1,'',true)+' <span style="color:var(--muted)">vs sem. anterior</span>',[5,4,4,3,4,crit],'#fdeceb')+
    ok(SC.a,'🛡️','En riesgo',riesgo,'Cocinas en atención',delta(1,'',false)+' <span style="color:var(--muted)">vs sem. anterior</span>',[3,4,3,4,4,riesgo],'#fdf6e8')+
    ok(SC.g,'✅','Cumplen',cumplen,'Cocinas que cumplen',delta(2,'',false)+' <span style="color:var(--muted)">vs sem. anterior</span>',[5,5,6,6,7,cumplen],'#eef7f0')+
    ok('var(--cyan)','📈','Mejorando',mejor,'Cocinas con mejora',delta(3,'',false)+' <span style="color:var(--muted)">vs sem. anterior</span>',[2,3,3,4,5,mejor],'#eaf3fb')+
  '</div>';
  /* ---- Prioridades ---- */
  function prio(idx,x){var k=x.k,h=x.h,st=sttH(h),col=SC[st],t=turboOf(k);
    var items=['Turbo (RTWT): '+f2(t.rtwt)+' min','Basics: '+f1(k.bas)+'%','FoodCost: '+f1(28+k.gap)+'%'];
    return '<div class="card" style="background:'+(st==='r'?'#fdeceb':st==='a'?'#fdf6e8':'#eef7f0')+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div style="display:flex;gap:10px;align-items:center"><span style="width:26px;height:26px;border-radius:50%;background:'+col+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">'+idx+'</span><b style="font-size:14px;color:var(--primary)">'+k.n+'</b></div><span class="pill" style="background:'+col+'26;color:'+col+'">'+(st==='r'?'Crítica':'Atención')+'</span></div>'+
      '<div style="display:flex;gap:16px;margin-top:8px"><div><div style="font-size:24px;font-weight:800;color:'+col+';line-height:1">'+h+'%</div><div style="font-size:10.5px;color:var(--muted)">Salud general</div></div>'+
      '<ul style="list-style:none;font-size:11px;color:var(--slate);flex:1">'+items.map(function(i){return '<li style="margin:2px 0;display:flex;gap:6px"><span style="color:'+col+'">•</span>'+i+'</li>';}).join('')+'</ul></div>'+
      '<div style="text-align:right;font-size:15px;color:'+col+';font-weight:700;cursor:pointer;margin-top:4px;line-height:1">›</div></div>';}
  var prios='<div class="page-head mt" style="border:none;margin-bottom:4px"><div><h1 style="font-size:14px">Prioridades de la semana</h1></div></div>'+
    '<div class="grid g3">'+rows.slice(0,3).map(function(x,i){return prio(i+1,x);}).join('')+'</div>';
  /* ---- Tabla todas las cocinas ---- */
  function tc(v,st,dl){return '<td class="num" style="white-space:nowrap"><div><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+SC[st]+';margin-right:5px;vertical-align:middle"></span>'+v+'</div>'+(dl?'<div style="font-size:8.5px;margin-top:1px">'+dl+'</div>':'')+'</td>';}
  var trows=rows.map(function(x){var k=x.k,h=x.h,t=turboOf(k),go=goCumpl(k),fc=28+k.gap,gp=+(2.6-k.gap).toFixed(1),rotA=Math.round(80+k.rot*20);
    return '<tr>'+
      '<td style="white-space:nowrap;font-weight:600">🍳 '+k.n+'</td>'+
      tc(f2(k.iff)+'%',estado(k.iff),delta(vary(k.n+'ifv',1),' pp',false))+
      tc(f2(t.rtwt)+' min',estRTWT(t.rtwt),delta(vary(k.n+'rtwt',0.6),' min',true))+
      tc((gp>=0?'+':'')+f1(gp)+'%',gp>=-0.5?'g':gp>=-1.2?'a':'r',delta(vary(k.n+'gpv',0.5),' pp',false))+
      tc(f1(fc)+'%',fcSt(fc),delta(vary(k.n+'fcv',0.7),' pp',true))+
      tc(f2(k.acc)+'%',k.acc>=98?'g':k.acc>=96?'a':'r',delta(vary(k.n+'accv',0.6),' pp',false))+
      tc(go+'%',stGO(go),delta(vary(k.n+'gov',5),' pp',false))+
      tc(k.cap+'%',k.cap>=80?'g':k.cap>=60?'a':'r',delta(vary(k.n+'capv',6),' pp',false))+
      tc(k.cJul,k.cJul<=25?'g':k.cJul<=45?'a':'r',delta(vary(k.n+'canv',12),'',true))+
      tc(rotA+'%',rotA<=140?'g':rotA<=170?'a':'r',delta(vary(k.n+'rotv',10),' pp',true))+

/* ================= TURBO (RTWT & polígonos) ================= */
function turboOf(k){
  var rtwt=Math.max(0.6,Math.min(5,+((k.turbo-9)*0.62+0.7).toFixed(2)));
  var cov=Math.max(74,Math.min(97,Math.round(97-(rtwt-1)*6)));
  var stores=Math.round(k.staff*1.6)+6;
  var penal=rtwt>3.2?Math.max(1,Math.round((rtwt-3)*1.4)):(rtwt>2.7?1:0);
  var r9=Math.max(1,Math.min(30,Math.round((rtwt-1)*5)));
  var r79=Math.max(2,Math.min(22,Math.round(rtwt*3)));
  var r7=Math.max(0,100-r9-r79);
  return {rtwt:rtwt,cov:cov,stores:stores,penal:penal,r7:r7,r79:r79,r9:r9};
}
function estRTWT(v){return v<2?'g':v<8?'a':'r';}
function estRTWTtxt(v){return v<2?'Saludable':v<8?'Atención':'Crítico';}
function colCov(v){return v>=90?C_OK:v>=82?C_MID:C_LOW;}
var PBRANDS=['Mañanero Diario','Desayuno Mi Tierrita','Mr Beast Burger','la Cuadra Desayunos','Dembow','Cocina Abierta'];
function penalRows(k){var t=turboOf(k),out=[];for(var i=0;i<t.penal;i++){var rt=8.0+((k.turbo*7+i*13)%230)/10;out.push({marca:PBRANDS[(k.n.length+i)%PBRANDS.length],cocina:k.n,ciudad:k.city,rtwt:rt,sem:((i+k.staff)%4)+1});}return out;}

function rtwtHist(base,key,ctx){
  var rc=base, rp=+(rc+Math.abs(vary(key+'rA',0.7))).toFixed(2), rp2=+(rp+Math.abs(vary(key+'rB',0.8))).toFixed(2);
  var rwk=[['Sem 27',rp2],['Sem 28',rp],['Sem 29',rc]];
  var RLBL={g:'Saludable',a:'Atención',r:'Crítico'};
  var rsts=rwk.map(w=>estRTWT(w[1]));
  var rAllIn=rsts.every(s=>s==='g'),rAllOut=rsts.every(s=>s==='r');
  var m,c,ic;
  if(rAllIn){m='Excelente — todo en rango';c='var(--green)';ic='🌟';}
  else if(rAllOut){m='Crítico — todo fuera de rango';c='var(--red)';ic='⛔';}
  else if(rc<rp2-0.1){m='Buena tendencia — RTWT bajando';c='var(--green)';ic='📈';}
  else if(rc>rp2+0.1){m='Mala tendencia — RTWT subiendo';c='var(--red)';ic='📉';}
  else{m='Sigue igual — sin cambios relevantes';c='var(--amber)';ic='➖';}
  var cols=rwk.map(function(w){var s=estRTWT(w[1]);var cc=stCol(s);return '<div style="flex:1;text-align:center;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px 6px"><div style="font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:6px">'+w[0]+'</div><div style="font-size:22px;font-weight:700;color:'+cc+'">'+f2(w[1])+' min</div><div style="margin-top:8px"><span class="pill '+s+'"><span class="dot '+s+'" style="margin-right:4px"></span>'+RLBL[s]+'</span></div></div>';}).join('');
  return '<div class="card"><h3>Historial de RTWT · últimas 3 semanas</h3><div class="csub">Meta ≤ 8 min · '+ctx+'</div><div style="display:flex;gap:8px;margin-top:6px">'+cols+'</div><div style="margin-top:12px;background:'+c+'14;border:1px solid '+c+'40;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:600;color:'+c+'">'+ic+' '+m+'</div></div>';
}

    var cargos=[['Jefe de cocina',1,240],['Segundo de cocina',1,400],['Auxiliar de pase',0,0],['Tripulación',3,120]];

    var cargoCard='<div class="card pad0"><div style="padding:11px 13px 3px"><h3>Rotación por cargo</h3><div class="csub">Bajas y % anualizado · '+k.n+'</div></div><div style="padding:0 5px 5px"><table><thead><tr><th>Cargo</th><th class="num">Bajas</th><th class="num">% Anualizado</th></tr></thead><tbody>'+crows+'</tbody></table></div></div>';
    var motivos='<div class="card"><h3>Motivos principales</h3><div class="csub">Julio · '+k.n+'</div>'+
      hbar('Faltas injustificadas',100,'var(--mauve)','14')+hbar('Motivos personales',72,'var(--sea)','10')+hbar('Mejor oferta económica',36,'var(--sand)','5')+
      (isCrit?'<div class="note" style="border-color:'+C_LOW+';color:'+C_LOW+'">⚠️ Cocina crítica: '+isCrit[0]+'% mensual · '+isCrit[1]+'% anualizado.</div>':'')+'</div>';
    return head('Rotación — '+k.n,'Rotación de personal · mi cocina','')+
      heroRow(heroCard('Rotación mensual','120%','Meta: ≤ 141%','g','En meta',120/141*100,vdelta(k.n+'rot',8,' pp',true),true),
        kpiCard('var(--mauve)','📅','Anualizado',(isCrit?isCrit[1]:anual)+'%','proyección',null,null,'')+
        kpiCard('var(--teal)','👥','Personal activo',k.staff,'colaboradores',null,null,''),2)+
      '<div class="grid g2 mt">'+cargoCard+motivos+'</div>';
  }
  var rotOps={'Carlos García':[53,8,4,12,23,272],'Selene Cabrera':[49,2,4,6,12,147],'Sergio Torres':[79,2,0,2,3,30],'Guillermo Villalva':[65,2,3,5,8,92],'Claudia Valdez':[19,0,0,0,0,0],'Paulina Lima':[19,0,2,2,11,126]};
  var r=rotOps[selOps]||[0,0,0,0,0,0];var colr=r[4]>=20?C_LOW:r[4]>=10?C_MID:C_OK;
  var kpis=heroRow(heroCard('% Rotación','120%','Meta: ≤ 141%','g','En meta',120/141*100,vdelta(selOps+'rot',10,' pp',true),true),
    kpiCard('var(--teal)','👥','Activos',r[0],'colaboradores',null,null,'')+
    kpiCard('var(--slate)','📉','Retiros',r[3],r[1]+' invol. · '+r[2]+' vol.',null,null,'')+
    kpiCard('var(--mauve)','📅','Anualizado',r[5]+'%','proyección',null,null,''),3);
  var ks=opsKit(selOps);
  var rows=ks.map(function(k){var isc=crit[k.n];return '<tr><td>'+k.n+'</td><td class="num" style="color:'+colRot(k.rot)+'"><b>'+f1(k.rot)+'%</b></td><td class="num">'+(isc?isc[1]:Math.round(k.rot*12*4.5))+'%</td><td>'+(isc?'<span class="pill r">Crítica</span>':'<span class="pill g">OK</span>')+'</td></tr>';}).join('');
  var tbl='<div class="card pad0"><div style="padding:13px 15px 4px"><h3>Rotación por cocina</h3></div><div style="padding:0 6px 6px"><table><thead><tr><th>Cocina</th><th class="num">% Rot M</th><th class="num">Anualizado</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  var motivos='<div class="card"><h3>Motivos y focos</h3><div class="csub">Julio</div>'+
    hbar('Faltas injustificadas',100,'var(--mauve)','14')+hbar('Motivos personales',72,'var(--sea)','10')+hbar('Mejor oferta económica',36,'var(--sand)','5')+
    '<div class="note">Cocinas críticas del país: Lincoln (800% anualizado), Cumbres / Manacar (600%), Santa Catarina (400%).</div></div>';
  return head('Rotación por Ops — '+selOps,'Rotación de personal · Julio','')+
    kpis+'<div class="grid g2 mt">'+tbl+motivos+'</div>';
};

/* ================= BASICS ================= */
builders.bas=function(){
  function bloques(b){return [['Seguridad y cond. operativas',Math.min(b+4,100)],['Higiene personal y sanitaria',Math.max(b-5,0)],['Infraestructura y mantenimiento',Math.max(b-1,0)],['Limpieza y control ambiental',Math.min(b+2,100)]];}
  if(view==='coc'){var k=curK();var rk=KIT.slice().sort((a,b)=>b.bas-a.bas);var pos=rk.findIndex(x=>x.n===k.n)+1;var col=k.bas>=75?C_OK:k.bas>=50?C_MID:C_LOW;
    var bst=k.bas>=75?'g':k.bas>=50?'a':'r';
    return head('Basics — '+k.n,'Cumplimiento de básicos operativos · mi cocina','')+
      heroRow(heroCard('% Básicos',f1(k.bas)+'%','Meta: ≥ 75%',bst,(bst==='g'?'Alto':bst==='a'?'Medio':'Bajo'),k.bas,vdelta(k.n+'bas',5,' pp',false),true),
        kpiCard('var(--cyan)','🏆','Ranking','#'+pos,'de '+KIT.length+' cocinas',null,null,'')+
        kpiCard('var(--teal)','🎯','Estado',k.bas>=75?'Alto':k.bas>=50?'Medio':'Bajo',k.bas>=75?'≥ 75%':k.bas>=50?'50–75%':'< 50%',null,null,''),2)+
      '<div class="card mt"><h3>Detalle por bloque</h3><div class="csub">'+k.n+'</div>'+bloques(k.bas).map(function(b){return hbar(b[0],b[1],'var(--sea)',f1(b[1])+'%');}).join('')+'</div>';
  }
  var ks=opsKit(selOps);var prom=avg(ks.map(k=>k.bas));
  var bst=prom>=75?'g':prom>=50?'a':'r';
  var kpis=heroRow(heroCard('% Básicos promedio',f1(prom)+'%','Meta: ≥ 75%',bst,(bst==='g'?'Alto':bst==='a'?'Medio':'Bajo'),prom,vdelta(selOps+'bas',4,' pp',false),true),
    kpiCard(C_OK,'🟢','Cocinas ≥ 75%',ks.filter(k=>k.bas>=75).length,'de '+ks.length,null,null,'')+
    kpiCard(C_MID,'🟡','Cocinas 50–75%',ks.filter(k=>k.bas>=50&&k.bas<75).length,'de '+ks.length,null,null,'')+
    kpiCard(C_LOW,'🔴','Cocinas < 50%',ks.filter(k=>k.bas<50).length,'de '+ks.length,null,null,''),3);
  var rank=ks.slice().sort((a,b)=>b.bas-a.bas);
  var rankCard='<div class="card pad0"><div style="padding:13px 15px 4px"><h3>Ranking de cocinas</h3><div class="csub">Mayor a menor</div></div><div style="padding:0 6px 6px"><table><tbody>'+
    rank.map(function(r,i){var col=r.bas>=80?C_OK:r.bas>=60?C_MID:C_LOW;return '<tr><td style="width:34px;color:var(--muted)">#'+(i+1)+'</td><td>'+r.n+'</td><td class="num"><span class="pill" style="background:#eef6fb;color:var(--teal)">'+f1(r.bas)+'%</span></td><td><span class="mini-bar"><i style="width:'+r.bas+'%;background:'+col+'"></i></span></td></tr>';}).join('')+'</tbody></table></div></div>';
  var bl=[['Seguridad y cond. operativas',avg(ks.map(k=>Math.min(k.bas+4,100)))],['Higiene personal y sanitaria',avg(ks.map(k=>Math.max(k.bas-5,0)))],['Infraestructura y mantenimiento',avg(ks.map(k=>Math.max(k.bas-1,0)))],['Limpieza y control ambiental',avg(ks.map(k=>Math.min(k.bas+2,100)))]];
  var blCard='<div class="card"><h3>Detalle por bloque</h3><div class="csub">Promedio del Ops</div>'+bl.map(function(b){return hbar(b[0],b[1],'var(--sea)',f1(b[1])+'%');}).join('')+'</div>';
  return head('Basics por Ops — '+selOps,'Cumplimiento de básicos · todas las cocinas','')+
    kpis+'<div class="grid g2 mt">'+rankCard+blCard+'</div>';
};

/* ================= PLACEHOLDER ================= */
builders._ph=function(s){var d={};return head(s,'Sección en construcción','')+'<div class="card"><div class="placeholder"><div class="pic">🛠️</div><h2>En construcción</h2></div></div>';};

/* ================= INIT ================= */
populateSel();
render();
</script>
